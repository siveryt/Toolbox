server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Shown for every page that doesn't exist
    error_page 404 /404.html;

    # Compress text files. "proxied any": the site sits behind a reverse proxy,
    # whose requests would otherwise get no compression.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/plain text/xml application/xml image/svg+xml;

    # Short links used by the app (InfoView) and the README
    location = /download {
        return 301 https://apps.apple.com/us/app/toolbox-all-you-need/id1638758005;
    }

    location = /support {
        return 301 https://www.buymeacoffee.com/fcggnjcrpq7;
    }

    # File names don't change when the files do (e.g. mainscreen.webp after
    # new screenshots), so browsers keep them a week and the stylesheet a day.
    # HTML pages are checked again on every visit (ETag).
    location /assets/ {
        expires 7d;
    }

    location ~* \.(ico|png)$ {
        expires 7d;
    }

    location = /style.css {
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
